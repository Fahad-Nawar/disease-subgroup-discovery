<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aegis Health — Risk Predictor</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #F3F5F7; --surface: #FFFFFF; --surface-2: #F8FAFB;
    --border: #E4E8EE; --border-strong: #CDD4DD;
    --text: #0E1A2B; --text-muted: #607082; --text-subtle: #8C97A6;
    --primary: #1F4E8C; --primary-700: #163A6B; --primary-50: #EAF1FB;
    --hypertension: #B5413F; --hypertension-50: #FBEDED;
    --obesity: #C77A2C; --obesity-50: #FBF1E3;
    --diabetes: #1F6B5C; --diabetes-50: #E6F1EE;
    --warn: #C77A2C; --ok: #2E7D6F;
    --shadow-sm: 0 1px 2px rgba(14,26,43,.04);
    --shadow-md: 0 4px 16px rgba(14,26,43,.06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: 'Geist', -apple-system, sans-serif; background: var(--bg); color: var(--text);
    font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; min-height: 100vh; }
  .mono { font-family: 'JetBrains Mono', monospace; font-feature-settings: 'tnum' 1; }
  button { font-family: inherit; cursor: pointer; }
  .app { min-height: 100vh; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between;
    padding: 16px 32px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px;
    letter-spacing: -0.01em; color: var(--text); }
  .brand-mark { width: 26px; height: 26px; border-radius: 6px; background: var(--primary);
    display: grid; place-items: center; color: white; font-weight: 700; font-size: 14px; }
  .nav-right { display: flex; align-items: center; gap: 24px; font-size: 13px; color: var(--text-muted); }
  .nav-right .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok);
    display: inline-block; margin-right: 6px; }
  .main { flex: 1; display: flex; flex-direction: column; }
  .steps { display: flex; align-items: center; justify-content: center; gap: 0; padding: 24px 32px 8px; }
  .step { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text-subtle);
    letter-spacing: 0.04em; text-transform: uppercase; }
  .step .num { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--border-strong);
    display: grid; place-items: center; font-size: 11px; font-weight: 600; background: var(--surface); }
  .step.active { color: var(--primary); }
  .step.active .num { background: var(--primary); border-color: var(--primary); color: white; }
  .step.done { color: var(--primary); }
  .step.done .num { background: var(--primary-50); border-color: var(--primary); color: var(--primary); }
  .step-line { width: 56px; height: 1px; background: var(--border-strong); margin: 0 16px; }
  .step-line.done { background: var(--primary); }
  .container { max-width: 1200px; margin: 0 auto; padding: 32px; width: 100%; }
  .container-narrow { max-width: 720px; margin: 0 auto; padding: 32px; width: 100%; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--shadow-sm); }
  .card-pad { padding: 32px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 44px; padding: 0 20px; border-radius: 8px; font-weight: 500; font-size: 14px;
    border: 1px solid transparent; transition: all 0.15s ease; letter-spacing: -0.005em; }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { background: var(--primary-700); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--text); border-color: var(--border-strong); }
  .btn-ghost:hover { background: var(--surface-2); }
  .btn-text { background: transparent; color: var(--text-muted); border: none; padding: 0 8px; }
  .btn-text:hover { color: var(--text); }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12px; font-weight: 500; color: var(--text-muted); letter-spacing: 0.02em;
    display: flex; justify-content: space-between; align-items: center; }
  .field label .unit { font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--text-subtle); font-weight: 400; }
  .field input { width: 100%; height: 42px; padding: 0 12px; border: 1px solid var(--border-strong);
    border-radius: 8px; background: var(--surface); font-family: 'JetBrains Mono', monospace;
    font-size: 14px; color: var(--text); transition: border-color 0.15s ease, box-shadow 0.15s ease; }
  .field input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-50); }
  .field input.has-value { font-weight: 500; }
  .field .range-bar { position: relative; height: 4px; background: #EEF1F5;
    border-radius: 2px; margin-top: 8px; overflow: hidden; }
  .field .range-bar .healthy { position: absolute; top: 0; bottom: 0;
    background: rgba(46,125,111,.22); }
  .field .range-bar .marker { position: absolute; top: -3px; width: 2px; height: 10px;
    background: var(--text); border-radius: 1px; transform: translateX(-1px); transition: left 0.2s ease; }
  .field .range-meta { display: flex; justify-content: space-between;
    font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-subtle); margin-top: 4px; }
  .field-status { font-size: 11px; margin-top: 4px; font-weight: 500; height: 14px; }
  .field-status.ok { color: var(--ok); }
  .field-status.warn { color: var(--warn); }
  .field-status.high { color: var(--hypertension); }
  .section-eyebrow { font-size: 11px; font-weight: 600; color: var(--text-subtle);
    letter-spacing: 0.12em; text-transform: uppercase; }
  h1.headline { font-size: 32px; line-height: 1.15; letter-spacing: -0.02em;
    font-weight: 600; margin: 12px 0 8px; color: var(--text); }
  h2.h-section { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
  p.lead { color: var(--text-muted); font-size: 15px; line-height: 1.55; max-width: 560px; }
  .disclaimer { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px;
    background: #FFF7E6; border: 1px solid #F0DDB1; color: #7A5A1F; border-radius: 999px;
    font-size: 12px; font-weight: 500; }
  .disclaimer .icon { width: 12px; height: 12px; }
  .footer { padding: 20px 32px; border-top: 1px solid var(--border); background: var(--surface);
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; color: var(--text-subtle); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .fade-up { animation: fadeUp 0.4s ease both; }
  .prob-row { display: grid; grid-template-columns: 180px 1fr 80px; align-items: center;
    gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--border); }
  .prob-row:last-child { border-bottom: none; }
  .prob-label { display: flex; align-items: center; gap: 10px; font-weight: 500; font-size: 14px; }
  .prob-swatch { width: 10px; height: 10px; border-radius: 2px; }
  .prob-track { height: 10px; background: #EEF1F5; border-radius: 5px; overflow: hidden; }
  .prob-fill { height: 100%; border-radius: 5px; transition: width 0.8s cubic-bezier(.2,.8,.2,1); }
  .prob-pct { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600; text-align: right; }
  .prob-row.primary .prob-label { font-weight: 600; }
  .tag { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px;
    border-radius: 999px; font-size: 11px; font-weight: 500; letter-spacing: 0.02em; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
